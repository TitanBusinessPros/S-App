name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  function-test-coverage:
    name: Enforce 100% function test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node testing/functions/check-coverage.js

  functions-test:
    name: Test Cloud Functions
    runs-on: ubuntu-latest
    needs: function-test-coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root test tooling
        run: npm install
      - name: Install functions runtime deps
        run: npm install
        working-directory: functions
      - name: Build functions
        run: npm run build
        working-directory: functions
      - name: Run function tests
        run: npm run test:functions

  web-build:
    name: Build web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web

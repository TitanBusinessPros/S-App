name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  function-test-coverage:
    name: Enforce 100% function test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node testing/functions/check-coverage.js

  functions-test:
    name: Test Cloud Functions
    runs-on: ubuntu-latest
    needs: function-test-coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm install
      - name: Build functions
        run: npm run build --workspace functions
      - name: Run function tests
        run: npm run test:functions

  web-build:
    name: Build web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm install
      - name: Run web unit tests
        run: npm run test --workspace web
      - name: Build web app
        run: npm run build --workspace web
